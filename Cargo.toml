[package]
name = "zarr-datafusion"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.88"
description = "Extending DataFusion to do SQL queries on Zarr data."
repository = "https://github.com/jayendra13/zarr-datafusion"
homepage = "https://github.com/jayendra13/zarr-datafusion"
documentation = "https://docs.rs/zarr-datafusion"
readme = "README.md"
keywords = ["zarr", "datafusion", "sql", "arrow", "scientific-data"]
categories = ["database", "science", "data-structures"]

[lib]
# When python feature is enabled, build as cdylib for Python extension
# Normal library builds still work via rlib
crate-type = ["rlib", "cdylib"]

[features]
default = []
python = ["dep:pyo3", "dep:datafusion-ffi", "dep:arrow-pyarrow"]

[dependencies]
arrow = { version = "57.1.0", features = ["ffi"] }
arrow-pyarrow = { version = "57.1.0", optional = true }
async-trait = "0.1"
bytes = "1.5"
chrono = "0.4"
datafusion = "51.0.0"
futures = "0.3.31"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
zarrs = { version = "0.22.10", features = ["ndarray", "async", "zlib"] }
zarrs_object_store = { version = "0.6", features = ["gcp", "aws", "http"] }
parquet = { version = "57", default-features = false, features = ["arrow", "async"] }
glob = "0.3"
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[example]]
name = "query_era5"
path = "examples/query_era5.rs"

[[example]]
name = "query_synthetic"
path = "examples/query_synthetic.rs"

[[bin]]
name = "zarr-cli"
path = "src/bin/zarr_cli/main.rs"

[dependencies.rustyline]
version = "15"
features = ["derive"]

[dependencies.serde_json]
version = "1"

[dependencies.sqlparser]
version = "0.53"

[dependencies.nu-ansi-term]
version = "0.50"

[dependencies.pyo3]
version = "0.26"
features = ["extension-module"]
optional = true

[dependencies.datafusion-ffi]
version = "51.0.0"
optional = true

[dev-dependencies]
proptest = "1.0"

[build-dependencies]
pyo3-build-config = { version = "0.26", optional = true }

[target.'cfg(unix)'.build-dependencies]
pyo3-build-config = { version = "0.26", optional = true }
